name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install tensorflow-cpu pillow numpy pytest ruff
      - run: ruff check .
      # Loads the committed model and runs a real forward pass
      - run: pytest -q
